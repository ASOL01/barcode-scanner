<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>カメラテスト</title>
<style>
body{font-family:sans-serif;background:#111;color:#fff;padding:20px;}
video{width:100%;max-width:400px;background:#000;display:block;margin:10px 0;}
#log{background:#222;padding:10px;border-radius:8px;font-size:13px;line-height:1.8;margin-top:10px;word-break:break-all;}
button{padding:12px 20px;border-radius:8px;border:none;background:#185FA5;color:#fff;font-size:15px;font-weight:700;cursor:pointer;margin-top:10px;}
</style>
</head>
<body>
<h2>カメラテスト</h2>
<button onclick="startCamera()">カメラ起動</button>
<video id="v" autoplay playsinline muted></video>
<div id="log">ログ: 待機中</div>
<script>
const log = t => { document.getElementById('log').textContent += '\n' + t; };

async function startCamera() {
  log('getUserMedia 開始');
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: 'environment' }
    });
    log('ストリーム取得OK');
    const v = document.getElementById('v');
    v.srcObject = stream;
    log('srcObject セット');
    v.onloadedmetadata = () => log('loadedmetadata: ' + v.videoWidth + 'x' + v.videoHeight);
    v.oncanplay = () => log('canplay イベント');
    v.onplaying = () => log('playing イベント');
    v.onerror = e => log('videoエラー: ' + e);
    await v.play();
    log('play() 完了');
  } catch(e) {
    log('エラー: ' + e.name + ' / ' + e.message);
  }
}
</script>
</body>
</html>
