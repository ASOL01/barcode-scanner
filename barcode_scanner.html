<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>バーコードスキャン</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #000; color: #fff; height: 100vh; display: flex; justify-content: center; overflow: hidden; }

  #app-container {
    width: 100%; max-width: 600px; height: 100%;
    display: flex; flex-direction: column; background: #111;
  }

  #header { padding: 15px; background: #1a1a1a; text-align: center; border-bottom: 1px solid #333; z-index: 20; }
  #header h1 { font-size: 16px; font-weight: 700; }

  #camera-section {
    position: relative; width: 100%; height: 50vh; min-height: 300px;
    background: #000; overflow: hidden;
    display: flex; justify-content: center; align-items: center;
  }

  #reader { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
  #reader video { width: 100% !important; max-height: 100% !important; object-fit: cover; }

  #qr-shaded-region { display: none !important; }

  #snapshot {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover; display: none; z-index: 5;
  }

  #aim-frame {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 85%; max-width: 450px; height: 80px;
    border: 3px solid #00e5ff; border-radius: 8px;
    pointer-events: none; z-index: 10;
    box-shadow: 0 0 0 4000px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,229,255,0.3);
    transition: all 0.3s;
  }
  #aim-frame.success {
    border-color: #4caf50; background: rgba(76,175,80,0.2);
    box-shadow: 0 0 0 4000px rgba(0,0,0,0.7), inset 0 0 15px rgba(76,175,80,0.5);
  }

  #scanline {
    position: absolute; top: 0; left: 0; right: 0; height: 2px; background: #00e5ff;
    animation: sc 1.5s linear infinite; box-shadow: 0 0 8px #00e5ff;
  }
  #aim-frame.success #scanline { display: none; }
  @keyframes sc { 0% { top: 0%; } 100% { top: 100%; } }

  #action-section {
    flex: 1; padding: 20px; background: #111;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  }

  #status-msg { font-size: 15px; font-weight: bold; color: #00e5ff; margin-bottom: 20px; text-align: center; }

  #result-ui { width: 100%; display: none; }

  #einput {
    width: 100%; font-size: 24px; font-family: monospace; font-weight: bold; letter-spacing: 2px;
    padding: 15px; border-radius: 10px; border: 2px solid #4caf50; background: #222; color: #fff;
    text-align: center; margin-bottom: 20px;
  }

  .btns { display: flex; gap: 10px; width: 100%; }
  .btn { flex: 1; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: bold; border: none; cursor: pointer; }
  .b-ok { background: #185FA5; color: #fff; }
  .b-retry { background: #333; color: #ccc; }

  #close-btn-wrap { margin-top: auto; padding-top: 20px; width: 100%; }
  .b-close { width: 100%; padding: 14px; border-radius: 10px; background: #1a1a1a; color: #888; border: 1px solid #333; font-weight: bold; cursor: pointer; }
</style>
</head>
<body>

<div id="app-container">
  <div id="header">
    <h1>📷 バーコードスキャン</h1>
  </div>

  <div id="camera-section">
    <div id="reader"></div>
    <img id="snapshot" alt="スキャン結果">
    <div id="aim-frame">
      <div id="scanline"></div>
    </div>
  </div>

  <div id="action-section">
    <div id="status-msg">カメラを起動中...</div>

    <div id="result-ui">
      <input type="tel" id="einput" maxlength="15" inputmode="numeric">
      <div class="btns">
        <button class="btn b-ok" onclick="doConfirm()">✅ 確定</button>
        <button class="btn b-retry" onclick="doRetry()">🔄 再スキャン</button>
      </div>
    </div>

    <div id="close-btn-wrap">
      <button class="b-close" onclick="doClose()">閉じる</button>
    </div>
  </div>
</div>

<script>
let scanner = null;
let isScanning = true;

async function startScanner() {
  if (scanner) { try { await scanner.clear(); } catch(e) {} }
  scanner = new Html5Qrcode("reader");

  const config = {
    fps: 20,
    qrbox: (viewfinderWidth, viewfinderHeight) => {
      const boxWidth = Math.min(viewfinderWidth * 0.85, 450);
      return { width: Math.floor(boxWidth), height: 80 };
    },
    experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    formatsToSupport: [ Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.ITF ]
  };

  try {
    await scanner.start(
      { facingMode: "environment" },
      config,
      (decodedText) => {
        if (!isScanning) return;
        const cleanCode = decodedText.replace(/\D/g, '');
        if (cleanCode.length === 15) {
          isScanning = false;
          onSuccess(cleanCode);
        }
      },
      () => {}
    );
    document.getElementById('status-msg').textContent = "15桁のバーコードを枠に水平に合わせてください";
  } catch (err) {
    document.getElementById('status-msg').textContent = "カメラ起動エラー: " + err;
  }
}

function onSuccess(digits) {
  try {
    const videoEl = document.querySelector('#reader video');
    if (videoEl) {
      const canvas = document.createElement('canvas');
      canvas.width = videoEl.videoWidth;
      canvas.height = videoEl.videoHeight;
      canvas.getContext('2d').drawImage(videoEl, 0, 0, canvas.width, canvas.height);
      const snapshotEl = document.getElementById('snapshot');
      snapshotEl.src = canvas.toDataURL('image/jpeg');
      snapshotEl.style.display = 'block';
    }
  } catch(e) {}

  if (scanner) scanner.pause(true);

  document.getElementById('aim-frame').classList.add('success');
  document.getElementById('status-msg').style.display = 'none';
  document.getElementById('result-ui').style.display = 'block';
  document.getElementById('einput').value = digits;

  if (navigator.vibrate) navigator.vibrate(100);
}

function doRetry() {
  document.getElementById('snapshot').style.display = 'none';
  document.getElementById('aim-frame').classList.remove('success');
  document.getElementById('result-ui').style.display = 'none';
  document.getElementById('status-msg').style.display = 'block';
  document.getElementById('status-msg').style.color = '#00e5ff';
  document.getElementById('einput').value = '';

  if (scanner) scanner.resume();
  setTimeout(() => { isScanning = true; }, 300);
}

function doConfirm() {
  const val = document.getElementById('einput').value;
  const cleanVal = val.replace(/\D/g, '');

  if (cleanVal.length !== 15) {
    alert("15桁の数字に修正してください。");
    return;
  }

  // ポップアップ元のフォームにIMEIを返して閉じる
  if (window.opener) {
    window.opener.postMessage({ type: 'BARCODE_RESULT', barcode: cleanVal }, '*');
    window.close();
  } else {
    // 単独で開いた場合はアラートで表示
    alert('IMEI: ' + cleanVal);
  }
}

function doClose() {
  if (scanner && scanner.isScanning) {
    scanner.stop().then(() => window.close()).catch(() => window.close());
  } else {
    window.close();
  }
}

window.onload = startScanner;
</script>
</body>
</html>
