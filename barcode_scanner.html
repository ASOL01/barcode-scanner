<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>バーコードスキャン</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',Arial,sans-serif;background:#1a1a1a;color:#fff;height:100vh;display:flex;flex-direction:column;}
#header{padding:14px 16px 10px;background:#1a1a1a;flex-shrink:0;}
#header h1{font-size:16px;font-weight:700;margin-bottom:2px;}
#header p{font-size:12px;color:#aaa;}
#video-wrap{position:relative;flex:1;overflow:hidden;background:#000;}
#video{width:100%;height:100%;object-fit:cover;display:block;}
#aim{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);width:75%;max-width:320px;}
#aim-box{width:100%;padding-top:35%;position:relative;}
#aim-tl,#aim-tr,#aim-bl,#aim-br{position:absolute;width:28px;height:28px;border-color:#00e5ff;border-style:solid;}
#aim-tl{top:0;left:0;border-width:3px 0 0 3px;border-radius:4px 0 0 0;}
#aim-tr{top:0;right:0;border-width:3px 3px 0 0;border-radius:0 4px 0 0;}
#aim-bl{bottom:0;left:0;border-width:0 0 3px 3px;border-radius:0 0 0 4px;}
#aim-br{bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 4px 0;}
#scan-line{position:absolute;left:2%;width:96%;height:2px;background:linear-gradient(90deg,transparent,#00e5ff,transparent);top:50%;animation:scanmove 1.8s ease-in-out infinite;}
@keyframes scanmove{0%,100%{top:15%;}50%{top:85%;}}
#status{position:absolute;bottom:0;left:0;right:0;padding:12px 16px;text-align:center;font-size:14px;font-weight:600;background:rgba(0,0,0,0.6);}
#status.waiting{color:#aaa;}
#status.scanning{color:#00e5ff;}
#status.success{color:#4caf50;background:rgba(0,80,0,0.7);}
#status.error{color:#f44336;background:rgba(80,0,0,0.7);}
#footer{background:#1a1a1a;padding:16px;flex-shrink:0;}
#result-wrap{display:none;margin-bottom:12px;}
#result-num{font-size:24px;font-weight:700;letter-spacing:4px;font-family:monospace;text-align:center;padding:12px;background:#2a2a2a;border-radius:8px;margin-bottom:8px;word-break:break-all;}
#edit-input{width:100%;font-size:20px;font-family:monospace;font-weight:700;letter-spacing:3px;padding:10px 12px;border-radius:8px;border:1.5px solid #444;background:#2a2a2a;color:#fff;text-align:center;}
#edit-input:focus{outline:none;border-color:#00e5ff;}
#digit-badge{text-align:center;font-size:13px;font-weight:700;padding:6px 0;}
#digit-badge.ok{color:#4caf50;}
#digit-badge.ng{color:#f44336;}
.btn-row{display:flex;gap:8px;}
.btn{flex:1;padding:13px;border-radius:10px;font-size:14px;font-weight:700;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.btn-confirm{background:#185FA5;color:#fff;}
.btn-retry{background:#333;color:#ccc;}
.btn-close{background:#222;color:#888;border:0.5px solid #444;}
</style>
</head>
<body>
<div id="header">
  <h1>📷 バーコードスキャン</h1>
  <p>カメラをバーコードに向けてください</p>
</div>

<div id="video-wrap">
  <video id="video" autoplay playsinline muted></video>
  <div id="aim">
    <div id="aim-box">
      <div id="aim-tl"></div>
      <div id="aim-tr"></div>
      <div id="aim-bl"></div>
      <div id="aim-br"></div>
      <div id="scan-line"></div>
    </div>
  </div>
  <div id="status" class="waiting">カメラを起動中...</div>
</div>

<div id="footer">
  <div id="result-wrap">
    <div id="result-num"></div>
    <input type="tel" id="edit-input" maxlength="15" inputmode="numeric" placeholder="修正する場合はここを編集">
    <div id="digit-badge"></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-confirm" id="confirm-btn" onclick="confirmNumber()" style="display:none;">✅ この番号で確定</button>
    <button class="btn btn-retry" id="retry-btn" onclick="restart()" style="display:none;">🔄 再スキャン</button>
    <button class="btn btn-close" onclick="window.close()">閉じる</button>
  </div>
</div>

<script>
let stream = null;
let animFrame = null;
let detected = false;

async function start() {
  const statusEl = document.getElementById('status');
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } }
    });
    const video = document.getElementById('video');
    video.srcObject = stream;
    await video.play();

    if (!('BarcodeDetector' in window)) {
      statusEl.className = 'error';
      statusEl.textContent = 'このブラウザは非対応です。AndroidはChrome、iOSはSafariをご利用ください。';
      return;
    }

    statusEl.className = 'scanning';
    statusEl.textContent = 'バーコードを枠内に合わせてください';

    const detector = new BarcodeDetector({
      formats: ['ean_13', 'code_128', 'itf', 'code_39', 'qr_code']
    });

    async function detect() {
      if (detected) return;
      try {
        const barcodes = await detector.detect(video);
        if (barcodes.length > 0) {
          const digits = barcodes[0].rawValue.replace(/\D/g, '').slice(0, 15);
          if (digits.length >= 10) {
            detected = true;
            stopCamera();
            onSuccess(digits);
            return;
          }
        }
      } catch(e) {}
      animFrame = requestAnimationFrame(detect);
    }
    animFrame = requestAnimationFrame(detect);

  } catch(err) {
    statusEl.className = 'error';
    statusEl.textContent = err.name === 'NotAllowedError'
      ? 'カメラへのアクセスを許可してください'
      : 'カメラエラー: ' + err.message;
  }
}

function stopCamera() {
  if (animFrame) { cancelAnimationFrame(animFrame); animFrame = null; }
  if (stream) { stream.getTracks().forEach(t => t.stop()); stream = null; }
}

function onSuccess(digits) {
  document.getElementById('status').className = 'success';
  document.getElementById('status').textContent = '✓ 読み取り成功！';
  document.getElementById('scan-line').style.display = 'none';
  document.getElementById('result-num').textContent = digits;
  document.getElementById('edit-input').value = digits;
  document.getElementById('result-wrap').style.display = 'block';
  document.getElementById('confirm-btn').style.display = 'flex';
  document.getElementById('retry-btn').style.display = 'flex';
  updateBadge(digits.length);
}

document.getElementById('edit-input').addEventListener('input', function() {
  this.value = this.value.replace(/\D/g, '').slice(0, 15);
  document.getElementById('result-num').textContent = this.value;
  updateBadge(this.value.length);
});

function updateBadge(n) {
  const el = document.getElementById('digit-badge');
  el.textContent = n + ' / 15桁' + (n === 15 ? ' ✓' : '');
  el.className = n === 15 ? 'ok' : 'ng';
}

function confirmNumber() {
  const num = document.getElementById('edit-input').value.replace(/\D/g, '');
  if (num.length !== 15) {
    document.getElementById('status').className = 'error';
    document.getElementById('status').textContent = '15桁を確認してください（現在' + num.length + '桁）';
    return;
  }
  // opener（GASフォーム）にpostMessageで送信
  if (window.opener) {
    window.opener.postMessage({ type: 'BARCODE_RESULT', barcode: num }, '*');
  }
  window.close();
}

function restart() {
  detected = false;
  document.getElementById('result-wrap').style.display = 'none';
  document.getElementById('confirm-btn').style.display = 'none';
  document.getElementById('retry-btn').style.display = 'none';
  document.getElementById('scan-line').style.display = 'block';
  document.getElementById('status').className = 'waiting';
  document.getElementById('status').textContent = 'カメラを起動中...';
  start();
}

start();
</script>
</body>
</html>
