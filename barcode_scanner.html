<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>バーコードスキャン</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',Arial,sans-serif;background:#1a1a1a;color:#fff;height:100vh;display:flex;flex-direction:column;}
#header{padding:14px 16px 10px;flex-shrink:0;}
#header h1{font-size:16px;font-weight:700;margin-bottom:2px;}
#header p{font-size:12px;color:#aaa;}
#video-wrap{position:relative;flex:1;overflow:hidden;background:#000;}
video{width:100%;height:100%;object-fit:cover;display:block;}
#aim{position:absolute;top:50%;left:50%;transform:translate(-50%,-55%);width:80%;max-width:340px;}
#aim-box{width:100%;padding-top:30%;position:relative;}
#tl,#tr,#bl,#br{position:absolute;width:28px;height:28px;border-color:#00e5ff;border-style:solid;}
#tl{top:0;left:0;border-width:3px 0 0 3px;border-radius:4px 0 0 0;}
#tr{top:0;right:0;border-width:3px 3px 0 0;border-radius:0 4px 0 0;}
#bl{bottom:0;left:0;border-width:0 0 3px 3px;border-radius:0 0 0 4px;}
#br{bottom:0;right:0;border-width:0 3px 3px 0;border-radius:0 0 4px 0;}
#scanline{position:absolute;left:2%;width:96%;height:2px;background:linear-gradient(90deg,transparent,#00e5ff,transparent);top:50%;animation:scanmove 1.8s ease-in-out infinite;}
@keyframes scanmove{0%,100%{top:10%;}50%{top:90%;}}
#status{position:absolute;bottom:0;left:0;right:0;padding:10px 16px;text-align:center;font-size:14px;font-weight:600;background:rgba(0,0,0,0.65);}
#status.waiting{color:#aaa;}
#status.scanning{color:#00e5ff;}
#status.success{color:#4caf50;background:rgba(0,60,0,0.75);}
#status.error{color:#f44336;background:rgba(60,0,0,0.75);}
#footer{background:#1a1a1a;padding:14px 16px;flex-shrink:0;}
#result-wrap{display:none;margin-bottom:10px;}
#result-num{font-size:22px;font-weight:700;letter-spacing:4px;font-family:monospace;text-align:center;padding:10px;background:#2a2a2a;border-radius:8px;margin-bottom:6px;word-break:break-all;}
#edit-input{width:100%;font-size:18px;font-family:monospace;font-weight:700;letter-spacing:3px;padding:8px 12px;border-radius:8px;border:1.5px solid #444;background:#2a2a2a;color:#fff;text-align:center;}
#edit-input:focus{outline:none;border-color:#00e5ff;}
#digit-badge{text-align:center;font-size:12px;font-weight:700;padding:4px 0;}
#digit-badge.ok{color:#4caf50;}
#digit-badge.ng{color:#f44336;}
.btn-row{display:flex;gap:8px;margin-top:10px;}
.btn{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:700;border:none;cursor:pointer;}
.btn:active{opacity:.75;}
.btn-confirm{background:#185FA5;color:#fff;}
.btn-retry{background:#333;color:#ccc;}
.btn-close{background:#222;color:#888;border:0.5px solid #444;}
</style>
</head>
<body>
<div id="header">
  <h1>📷 バーコードスキャン</h1>
  <p>バーコードを枠内に合わせてください（CODE-128）</p>
</div>

<div id="video-wrap">
  <video id="video" autoplay playsinline muted></video>
  <div id="aim">
    <div id="aim-box">
      <div id="tl"></div><div id="tr"></div>
      <div id="bl"></div><div id="br"></div>
      <div id="scanline"></div>
    </div>
  </div>
  <div id="status" class="waiting">カメラを起動中...</div>
</div>

<div id="footer">
  <div id="result-wrap">
    <div id="result-num"></div>
    <input type="tel" id="edit-input" maxlength="15" inputmode="numeric" placeholder="修正する場合はここを編集">
    <div id="digit-badge"></div>
  </div>
  <div class="btn-row">
    <button class="btn btn-confirm" id="confirm-btn" onclick="confirmNumber()" style="display:none;">✅ 確定</button>
    <button class="btn btn-retry" id="retry-btn" onclick="restart()" style="display:none;">🔄 再スキャン</button>
    <button class="btn btn-close" onclick="stopAndClose()">閉じる</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<script>
let codeReader = null;
let scanning = false;

async function start() {
  const statusEl = document.getElementById('status');
  try {
    const hints = new Map();
    hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.CODE_128]);
    hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

    codeReader = new ZXing.BrowserCodeReader(500, hints);

    // 背面カメラを取得
    const devices = await codeReader.listVideoInputDevices();
    let deviceId = undefined;
    // 背面カメラを優先
    const back = devices.find(d => /back|rear|environment/i.test(d.label));
    if (back) deviceId = back.deviceId;
    else if (devices.length > 0) deviceId = devices[devices.length - 1].deviceId;

    statusEl.className = 'scanning';
    statusEl.textContent = 'バーコードを枠内に合わせてください';
    scanning = true;

    codeReader.decodeFromVideoDevice(deviceId, 'video', (result, err) => {
      if (!scanning) return;
      if (result) {
        scanning = false;
        const text = result.getText();
        const digits = text.replace(/\D/g, '').slice(0, 15);
        onSuccess(digits.length >= 10 ? digits : text);
      }
    });

  } catch(err) {
    statusEl.className = 'error';
    if (err.name === 'NotAllowedError') {
      statusEl.textContent = 'カメラへのアクセスを許可してください';
    } else {
      statusEl.textContent = 'エラー: ' + err.message;
    }
  }
}

function onSuccess(digits) {
  document.getElementById('status').className = 'success';
  document.getElementById('status').textContent = '✓ 読み取り成功！';
  document.getElementById('scanline').style.display = 'none';
  document.getElementById('result-num').textContent = digits;
  document.getElementById('edit-input').value = digits;
  document.getElementById('result-wrap').style.display = 'block';
  document.getElementById('confirm-btn').style.display = 'flex';
  document.getElementById('retry-btn').style.display = 'flex';
  updateBadge(digits.length);
}

document.getElementById('edit-input').addEventListener('input', function() {
  this.value = this.value.replace(/\D/g, '').slice(0, 15);
  document.getElementById('result-num').textContent = this.value;
  updateBadge(this.value.length);
});

function updateBadge(n) {
  const el = document.getElementById('digit-badge');
  el.textContent = n + ' / 15桁' + (n === 15 ? ' ✓' : '');
  el.className = n === 15 ? 'ok' : 'ng';
}

function confirmNumber() {
  const num = document.getElementById('edit-input').value.replace(/\D/g, '');
  if (num.length !== 15) {
    document.getElementById('status').className = 'error';
    document.getElementById('status').textContent = '15桁を確認してください（現在' + num.length + '桁）';
    return;
  }
  if (window.opener) window.opener.postMessage({ type: 'BARCODE_RESULT', barcode: num }, '*');
  stopAndClose();
}

async function restart() {
  if (codeReader) { try { codeReader.reset(); } catch(e){} }
  document.getElementById('result-wrap').style.display = 'none';
  document.getElementById('confirm-btn').style.display = 'none';
  document.getElementById('retry-btn').style.display = 'none';
  document.getElementById('scanline').style.display = 'block';
  await start();
}

function stopAndClose() {
  if (codeReader) { try { codeReader.reset(); } catch(e){} }
  window.close();
}

start();
</script>
</body>
</html>
