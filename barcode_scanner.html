<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>バーコードスキャン</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',Arial,sans-serif;background:#1a1a1a;color:#fff;min-height:100vh;display:flex;flex-direction:column;padding:20px 16px 40px;}
h1{font-size:18px;font-weight:700;margin-bottom:4px;}
.sub{font-size:13px;color:#aaa;margin-bottom:20px;}
.capture-btns{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px;}
.cap-btn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:20px 10px;border-radius:12px;border:1.5px solid #444;background:#2a2a2a;font-size:13px;font-weight:600;color:#ccc;cursor:pointer;position:relative;overflow:hidden;-webkit-tap-highlight-color:transparent;}
.cap-btn:active{background:#333;}
.cap-btn .icon{font-size:28px;line-height:1;}
.cap-btn input[type=file]{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer;font-size:0;}
#preview-wrap{display:none;border-radius:10px;overflow:hidden;background:#000;margin-bottom:12px;max-height:240px;}
#preview{width:100%;max-height:240px;object-fit:contain;display:block;}
.status{padding:10px 14px;border-radius:8px;font-size:13px;font-weight:600;margin-bottom:10px;display:none;align-items:center;gap:8px;word-break:break-all;}
.status.show{display:flex;}
.status.info{background:#1a2a4a;color:#7ab3f5;}
.status.success{background:#1a3a2a;color:#4caf50;}
.status.error{background:#3a1a1a;color:#f44336;}
.spinner{width:16px;height:16px;border:2px solid rgba(122,179,245,0.3);border-top-color:#7ab3f5;border-radius:50%;animation:spin .7s linear infinite;flex-shrink:0;}
@keyframes spin{to{transform:rotate(360deg);}}
#result-wrap{display:none;margin-bottom:14px;}
#result-num{font-size:26px;font-weight:700;letter-spacing:4px;font-family:monospace;text-align:center;padding:14px;background:#2a2a2a;border-radius:8px;margin-bottom:8px;word-break:break-all;}
#edit-input{width:100%;font-size:20px;font-family:monospace;font-weight:700;letter-spacing:3px;padding:10px 12px;border-radius:8px;border:1.5px solid #444;background:#2a2a2a;color:#fff;text-align:center;}
#edit-input:focus{outline:none;border-color:#7ab3f5;}
#digit-badge{text-align:center;font-size:13px;font-weight:700;padding:6px 0;}
#digit-badge.ok{color:#4caf50;}
#digit-badge.ng{color:#f44336;}
.btn-row{display:flex;gap:8px;margin-top:10px;}
.btn{flex:1;padding:13px;border-radius:10px;font-size:14px;font-weight:700;border:none;cursor:pointer;-webkit-tap-highlight-color:transparent;}
.btn:active{opacity:.75;}
.btn-confirm{background:#185FA5;color:#fff;}
.btn-retry{background:#333;color:#ccc;}
.btn-close{background:#222;color:#888;border:0.5px solid #444;}
</style>
</head>
<body>
<h1>📷 バーコードスキャン</h1>
<p class="sub">バーコードを横向きに、画面いっぱいに撮影してください</p>

<div class="capture-btns">
  <label class="cap-btn">
    <span class="icon">📷</span>
    <span>カメラで撮影</span>
    <input type="file" accept="image/*" capture="environment" id="camera-input">
  </label>
  <label class="cap-btn">
    <span class="icon">🖼️</span>
    <span>アルバムから選択</span>
    <input type="file" accept="image/*" id="gallery-input">
  </label>
</div>

<div id="preview-wrap">
  <img id="preview" alt="プレビュー">
</div>

<div class="status" id="status"></div>

<div id="result-wrap">
  <div id="result-num"></div>
  <input type="tel" id="edit-input" maxlength="15" inputmode="numeric" placeholder="修正する場合はここを編集">
  <div id="digit-badge"></div>
</div>

<div class="btn-row">
  <button class="btn btn-confirm" id="confirm-btn" onclick="confirmNumber()" style="display:none;">✅ この番号で確定</button>
  <button class="btn btn-retry" id="retry-btn" onclick="retry()" style="display:none;">🔄 撮り直す</button>
  <button class="btn btn-close" onclick="window.close()">閉じる</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.20.0/umd/index.min.js"></script>
<script>
const cameraInput  = document.getElementById('camera-input');
const galleryInput = document.getElementById('gallery-input');
const preview      = document.getElementById('preview');
const previewWrap  = document.getElementById('preview-wrap');
const statusEl     = document.getElementById('status');
const resultWrap   = document.getElementById('result-wrap');
const resultNum    = document.getElementById('result-num');
const editInput    = document.getElementById('edit-input');
const digitBadge   = document.getElementById('digit-badge');
const confirmBtn   = document.getElementById('confirm-btn');
const retryBtn     = document.getElementById('retry-btn');

function setStatus(msg, type) {
  if (!type) { statusEl.className = 'status'; return; }
  statusEl.className = 'status show ' + type;
  statusEl.innerHTML = type === 'info' ? '<div class="spinner"></div>' + msg : msg;
}

// CODE-128に特化したヒント
const hints = new Map();
hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.CODE_128]);
hints.set(ZXing.DecodeHintType.TRY_HARDER, true);

function decodeFromCanvas(canvas) {
  const w = canvas.width;
  const h = canvas.height;
  const ctx = canvas.getContext('2d');

  // 試すスケール一覧（CODE-128は横長なので横幅を保ちつつ縦を絞ると効果的）
  const attempts = [
    // [scaleW, scaleH, rotate]
    [1.0, 1.0, 0],
    [1.0, 0.5, 0],   // 縦半分（バーコード部分だけ切り抜き効果）
    [0.5, 1.0, 0],
    [1.5, 1.5, 0],
    [2.0, 2.0, 0],
    [1.0, 1.0, 90],  // 90度回転
    [1.0, 1.0, 270], // 270度回転
  ];

  for (const [sw, sh, deg] of attempts) {
    try {
      let srcW = Math.round(w * sw);
      let srcH = Math.round(h * sh);
      const tmp = document.createElement('canvas');

      if (deg === 90 || deg === 270) {
        tmp.width = srcH;
        tmp.height = srcW;
        const tc = tmp.getContext('2d');
        tc.translate(tmp.width / 2, tmp.height / 2);
        tc.rotate(deg * Math.PI / 180);
        tc.drawImage(canvas, -srcW / 2, -srcH / 2, srcW, srcH);
      } else {
        // 縦半分の場合は中央帯だけ切り出す
        tmp.width = srcW;
        tmp.height = srcH;
        const tc = tmp.getContext('2d');
        const sy = sh < 1.0 ? Math.round(h * (1 - sh) / 2) : 0;
        tc.drawImage(canvas, 0, sy, w, Math.round(h * sh), 0, 0, srcW, srcH);
      }

      const imageData = tmp.getContext('2d').getImageData(0, 0, tmp.width, tmp.height);

      // HybridBinarizer
      try {
        const src = new ZXing.RGBLuminanceSource(imageData.data, tmp.width, tmp.height);
        const bmp = new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(src));
        const result = new ZXing.MultiFormatReader().decode(bmp, hints);
        if (result) return result.getText();
      } catch(e) {}

      // GlobalHistogramBinarizer
      try {
        const src2 = new ZXing.RGBLuminanceSource(imageData.data, tmp.width, tmp.height);
        const bmp2 = new ZXing.BinaryBitmap(new ZXing.GlobalHistogramBinarizer(src2));
        const result2 = new ZXing.MultiFormatReader().decode(bmp2, hints);
        if (result2) return result2.getText();
      } catch(e) {}

    } catch(e) {}
  }
  return null;
}

function handleFile(file) {
  if (!file) return;
  const url = URL.createObjectURL(file);
  preview.src = url;
  previewWrap.style.display = 'block';
  resultWrap.style.display = 'none';
  confirmBtn.style.display = 'none';
  retryBtn.style.display = 'none';
  setStatus('読み取り中...', 'info');

  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = img.naturalWidth;
    canvas.height = img.naturalHeight;
    canvas.getContext('2d').drawImage(img, 0, 0);

    const text = decodeFromCanvas(canvas);
    if (text) {
      const digits = text.replace(/\D/g, '').slice(0, 15);
      if (digits.length >= 10) { onSuccess(digits); return; }
    }
    setStatus('読み取れませんでした。バーコードを横向きで近づけて撮影し直してください。', 'error');
    retryBtn.style.display = 'flex';
  };
  img.onerror = () => {
    setStatus('画像の読み込みに失敗しました。', 'error');
    retryBtn.style.display = 'flex';
  };
  img.src = url;
}

cameraInput.addEventListener('change',  e => handleFile(e.target.files[0]));
galleryInput.addEventListener('change', e => handleFile(e.target.files[0]));

function onSuccess(digits) {
  setStatus('✓ 読み取り成功！内容を確認して確定してください。', 'success');
  resultNum.textContent = digits;
  editInput.value = digits;
  resultWrap.style.display = 'block';
  confirmBtn.style.display = 'flex';
  retryBtn.style.display = 'flex';
  updateBadge(digits.length);
}

editInput.addEventListener('input', function() {
  this.value = this.value.replace(/\D/g, '').slice(0, 15);
  resultNum.textContent = this.value;
  updateBadge(this.value.length);
});

function updateBadge(n) {
  digitBadge.textContent = n + ' / 15桏' + (n === 15 ? ' ✓' : '');
  digitBadge.className = n === 15 ? 'ok' : 'ng';
}

function confirmNumber() {
  const num = editInput.value.replace(/\D/g, '');
  if (num.length !== 15) {
    setStatus('15桏の番号を確認してください（現在' + num.length + '桏）', 'error');
    return;
  }
  if (window.opener) window.opener.postMessage({ type: 'BARCODE_RESULT', barcode: num }, '*');
  window.close();
}

function retry() {
  previewWrap.style.display = 'none';
  preview.src = '';
  resultWrap.style.display = 'none';
  confirmBtn.style.display = 'none';
  retryBtn.style.display = 'none';
  cameraInput.value = '';
  galleryInput.value = '';
  setStatus('', '');
}
</script>
</body>
</html>
