<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>バーコードスキャン</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,sans-serif;background:#000;color:#fff;height:100vh;display:flex;justify-content:center;overflow:hidden;}

/* 全体コンテナ: iPad/スマホ共通 */
#app-container {
  width: 100%; max-width: 500px; height: 100%;
  display: flex; flex-direction: column; position: relative; background: #000;
}

#header{padding:15px; flex-shrink:0; background:rgba(17,17,17,0.9); z-index:20;}
#header h1{font-size:16px; font-weight:700;}
#header p{font-size:11px; color:#aaa; margin-top:4px;}

/* スキャナー領域 */
#reader-wrap {
  flex: 1; position: relative; overflow: hidden; background: #000;
}
#reader { width: 100%; height: 100%; }

/* --- 【重要】ライブラリの不要なUI（白枠・ガイド）を徹底的に消す --- */
#reader__scan_region { border: none !important; }
#reader__scan_region img { display: none !important; } /* カメラ許可待ちの画像等も非表示 */
#reader video { 
  object-fit: cover !important; 
  width: 100% !important; 
  height: 100% !important; 
}

/* --- 自作の青枠（これだけに統一） --- */
#aim-frame {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -60%);
  width: 80%; height: 140px; /* バーコードが入りやすい高さに調整 */
  border: 3px solid #00e5ff; border-radius: 12px;
  pointer-events: none; z-index: 10;
  transition: all 0.3s ease;
  box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,0,0,0.5);
}
/* 成功時の緑枠 */
#aim-frame.success { 
  border-color: #4caf50; 
  background: rgba(76, 175, 80, 0.1); 
  box-shadow: 0 0 30px rgba(76, 175, 80, 0.4);
}

#scanline {
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg,transparent,#00e5ff,transparent);
  animation: sc 2s linear infinite;
}
#aim-frame.success #scanline { display: none; }

@keyframes sc{0%{top:0%}100%{top:100%}}

#msg {
  position: absolute; bottom: 20px; left: 10px; right: 10px;
  padding: 12px; text-align:center; font-size:13px; font-weight:600;
  background: rgba(0,0,0,0.7); border-radius: 8px; z-index: 20;
}

/* フッター */
#footer {
  background: #111; padding: 15px 15px 30px; flex-shrink:0; z-index: 20;
  border-top: 1px solid #333;
}
#result { display: none; }
#rnum {
  font-size: 26px; font-weight: 700; letter-spacing: 2px;
  text-align: center; color: #00e5ff; margin-bottom: 10px; font-family: monospace;
}
#einput {
  width: 100%; font-size: 20px; padding: 12px; border-radius: 10px;
  border: 1px solid #444; background: #222; color: #fff; text-align: center;
}

.btns { display: flex; gap: 10px; margin-top: 15px; }
.btn { flex: 1; padding: 15px; border-radius: 12px; font-size: 15px; font-weight: 700; border: none; cursor: pointer; }
.b-ok { background: #185FA5; color: #fff; }
.b-retry { background: #333; color: #ccc; }
</style>
</head>
<body>

<div id="app-container">
  <div id="header">
    <h1>📷 バーコードスキャン</h1>
    <p>青枠内にバーコードを水平に合わせてください</p>
  </div>

  <div id="reader-wrap">
    <div id="reader"></div>
    <div id="aim-frame" id="aim-frame">
      <div id="scanline"></div>
    </div>
    <div id="msg">カメラを起動中...</div>
  </div>

  <div id="footer">
    <div id="result">
      <div id="rnum"></div>
      <input type="tel" id="einput" maxlength="15" inputmode="numeric">
    </div>
    <div class="btns">
      <button class="btn b-ok" id="bok" onclick="doConfirm()" style="display:none;">✅ 確定</button>
      <button class="btn b-retry" id="bretry" onclick="doRestart()" style="display:none;">🔄 再スキャン</button>
    </div>
  </div>
</div>

<script>
let html5QrCode = null;
const msg = document.getElementById('msg');
const frame = document.getElementById('aim-frame');

async function startScanner() {
  if (html5QrCode) {
    try { await html5QrCode.clear(); } catch(e) {}
  }
  html5QrCode = new Html5Qrcode("reader");

  const config = {
    fps: 20,
    // スキャン範囲を自作青枠のサイズ (80% x 140px) に厳密に合わせる
    qrbox: (viewWidth, viewHeight) => {
        const width = viewWidth * 0.8;
        return { width: width, height: 140 };
    },
    aspectRatio: 1.0,
    experimentalFeatures: {
        useBarCodeDetectorIfSupported: true 
    },
    formatsToSupport: [ 
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.ITF
    ]
  };

  try {
    await html5QrCode.start(
      { facingMode: "environment" },
      config,
      (decodedText) => {
        const cleanCode = decodedText.replace(/\D/g, '').slice(0, 15);
        if (cleanCode.length >= 10) onSuccess(cleanCode);
      },
      () => {} 
    );
    msg.textContent = "枠に合わせてください";
  } catch (err) {
    msg.textContent = "カメラの起動に失敗しました";
    console.error(err);
  }
}

function onSuccess(digits) {
  // スキャナーを一時停止してフリーズを防ぐ
  if(html5QrCode.isScanning) html5QrCode.pause(true);
  
  // UIフィードバック
  frame.classList.add('success');
  msg.style.color = '#4caf50';
  msg.textContent = "✓ 読み取り成功";
  
  document.getElementById('rnum').textContent = digits;
  document.getElementById('einput').value = digits;
  document.getElementById('result').style.display = 'block';
  document.getElementById('bok').style.display = 'block';
  document.getElementById('bretry').style.display = 'block';

  if (navigator.vibrate) navigator.vibrate(100);
}

function doRestart() {
  frame.classList.remove('success');
  document.getElementById('result').style.display = 'none';
  document.getElementById('bok').style.display = 'none';
  document.getElementById('bretry').style.display = 'none';
  msg.style.color = '#fff';
  msg.textContent = "枠に合わせてください";
  
  // 再開
  if (html5QrCode) html5QrCode.resume();
}

function doConfirm() {
  const val = document.getElementById('einput').value;
  if (window.opener) window.opener.postMessage({ type: 'BARCODE_RESULT', barcode: val }, '*');
  
  if (html5QrCode) {
    html5QrCode.stop().then(() => window.close()).catch(() => window.close());
  } else {
    window.close();
  }
}

// ページを離れるときにカメラを解放
window.onbeforeunload = () => {
  if (html5QrCode) html5QrCode.stop();
};

window.onload = startScanner;
</script>
</body>
</html>
