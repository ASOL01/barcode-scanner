<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>バーコードスキャン</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,BlinkMacSystemFont,'Hiragino Sans',Arial,sans-serif;background:#111;color:#fff;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
#header{padding:12px 16px 8px;flex-shrink:0;}
#header h1{font-size:15px;font-weight:700;}
#header p{font-size:11px;color:#888;margin-top:2px;}
#video-wrap{position:relative;flex:1;overflow:hidden;background:#000;}
#video{width:100%;height:100%;object-fit:cover;display:block;}
#overlay{position:absolute;inset:0;pointer-events:none;}
#aim-rect{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);width:85%;height:22%;border:2px solid #00e5ff;border-radius:6px;box-shadow:0 0 0 9999px rgba(0,0,0,0.45);}
#scanline{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#00e5ff,transparent);animation:scan 2s linear infinite;}
@keyframes scan{0%{top:0;}100%{top:100%;}}
#status-bar{position:absolute;bottom:0;left:0;right:0;padding:8px 12px;text-align:center;font-size:13px;font-weight:600;background:rgba(0,0,0,0.6);}
#footer{background:#181818;padding:12px 16px 20px;flex-shrink:0;}
#result-wrap{display:none;margin-bottom:10px;}
#result-num{font-size:22px;font-weight:700;letter-spacing:3px;font-family:monospace;text-align:center;padding:10px;background:#252525;border-radius:8px;margin-bottom:6px;}
#edit-input{width:100%;font-size:18px;font-family:monospace;font-weight:700;letter-spacing:2px;padding:8px 10px;border-radius:8px;border:1.5px solid #444;background:#252525;color:#fff;text-align:center;}
#edit-input:focus{outline:none;border-color:#00e5ff;}
#badge{text-align:center;font-size:12px;font-weight:700;padding:3px 0;}
#badge.ok{color:#4caf50;}#badge.ng{color:#f44336;}
.btns{display:flex;gap:8px;margin-top:8px;}
.btn{flex:1;padding:12px;border-radius:10px;font-size:14px;font-weight:700;border:none;cursor:pointer;}
.btn:active{opacity:.7;}
.b-ok{background:#185FA5;color:#fff;}
.b-retry{background:#333;color:#ccc;}
.b-close{background:#1a1a1a;color:#777;border:0.5px solid #333;}
</style>
</head>
<body>
<div id="header">
  <h1>📷 バーコードスキャン</h1>
  <p>バーコードを青枠に合わせてください</p>
</div>

<div id="video-wrap">
  <video id="video" autoplay playsinline muted></video>
  <div id="overlay">
    <div id="aim-rect">
      <div id="scanline"></div>
    </div>
  </div>
  <div id="status-bar">起動中...</div>
</div>

<div id="footer">
  <div id="result-wrap">
    <div id="result-num"></div>
    <input type="tel" id="edit-input" maxlength="15" inputmode="numeric" placeholder="番号を確認・修正">
    <div id="badge"></div>
  </div>
  <div class="btns">
    <button class="btn b-ok" id="btn-ok" onclick="confirm_()" style="display:none;">✅ 確定</button>
    <button class="btn b-retry" id="btn-retry" onclick="restartScan()" style="display:none;">🔄 再スキャン</button>
    <button class="btn b-close" onclick="closeWindow()">閉じる</button>
  </div>
</div>

<script>
// ---- 設定 ----
const INTERVAL_MS = 400; // スキャン間隔(ms)

// ---- 状態 ----
let stream = null;
let timer  = null;
let found  = false;
const video   = document.getElementById('video');
const statusBar = document.getElementById('status-bar');
const scanline  = document.getElementById('scanline');

// ---- Canvas再利用 ----
const canvas = document.createElement('canvas');
const ctx    = canvas.getContext('2d', {willReadFrequently: true});

// ---- CODE-128デコーダ（純粋JS実装） ----
// ZXingではなく独自の軽量デコーダを使用
// バーの幅パターンからCODE-128を読み取る

function getGray(data, w, h) {
  // RGBA→グレースケール
  const gray = new Uint8Array(w * h);
  for (let i = 0; i < w * h; i++) {
    gray[i] = (data[i*4]*77 + data[i*4+1]*150 + data[i*4+2]*29) >> 8;
  }
  return gray;
}

function otsuThreshold(gray) {
  const hist = new Int32Array(256);
  for (const v of gray) hist[v]++;
  const n = gray.length;
  let sum = 0;
  for (let i = 0; i < 256; i++) sum += i * hist[i];
  let sumB = 0, wB = 0, max = 0, thresh = 128;
  for (let i = 0; i < 256; i++) {
    wB += hist[i]; if (!wB) continue;
    const wF = n - wB; if (!wF) break;
    sumB += i * hist[i];
    const mB = sumB / wB, mF = (sum - sumB) / wF;
    const between = wB * wF * (mB - mF) * (mB - mF);
    if (between > max) { max = between; thresh = i; }
  }
  return thresh;
}

// CODE-128 文字テーブル (値→文字)
const C128 = ' !"#$%&'()*+,-./0123456789:;<=>?@ABCDEFGHIJKLMNOPQRSTUVWXYZ[\\]^_`abcdefghijklmnopqrstuvwxyz{|}~';

const CODE128_PATTERNS = [
  212222,222122,222221,121223,121322,131222,122213,122312,132212,221213,
  221312,231212,112232,122132,122231,113222,123122,123221,223211,221132,
  221231,213212,223112,312131,311222,321122,321221,312212,322112,322211,
  212123,212321,232121,111323,131123,131321,112313,132113,132311,211313,
  231113,231311,112133,112331,132131,113123,113321,133121,313121,211331,
  231131,213113,213311,213131,311123,311321,331121,312113,312311,332111,
  314111,221411,431111,111224,111422,121124,121421,141122,141221,112214,
  112412,122114,122411,142112,142211,241211,221114,413111,241112,134111,
  111242,121142,121241,114212,124112,124211,411212,421112,421211,212141,
  214121,412121,111143,111341,131141,114113,114311,411113,411311,113141,
  114131,311141,411131,211412,211214,211232,2331112
];

function patternToCode128Value(bars) {
  // bars: [b0,b1,...,b5] 各バーの相対幅（整数化）
  const total = bars.reduce((a,b)=>a+b,0);
  const scale = total / 11;
  let key = 0, mul = 1;
  for (let i = bars.length-1; i >= 0; i--) {
    key += Math.round(bars[i]/scale) * mul;
    mul *= 10;
  }
  const idx = CODE128_PATTERNS.indexOf(key);
  return idx; // -1なら不明
}

function decodeCode128Row(gray, w, thresh) {
  // 二値化
  const bin = new Uint8Array(w);
  for (let x = 0; x < w; x++) bin[x] = gray[x] < thresh ? 1 : 0;

  // ランレングス（黒白交互のバー幅列）
  const runs = [];
  let cur = bin[0], cnt = 1;
  for (let x = 1; x < w; x++) {
    if (bin[x] === cur) cnt++;
    else { runs.push(cnt); cur = bin[x]; cnt = 1; }
  }
  runs.push(cnt);

  // 先頭が白なら先頭を削除（黒から始まる）
  let start = 0;
  if (bin[0] === 0) start = 1;

  const bars = runs.slice(start);
  if (bars.length < 13) return null;

  // スタートコードを探す（3バー+チェック）
  let decoded = [];
  let i = 0;
  let codeSet = -1; // A=0 B=1 C=2
  let found = false;

  // スタートコードを探す
  for (let si = 0; si < bars.length - 6; si++) {
    const seg = bars.slice(si, si+6);
    const val = patternToCode128Value(seg);
    if (val === 103) { codeSet = 0; i = si + 6; found = true; break; } // START A
    if (val === 104) { codeSet = 1; i = si + 6; found = true; break; } // START B
    if (val === 105) { codeSet = 2; i = si + 6; found = true; break; } // START C
  }
  if (!found) return null;

  const values = [];
  let checksum = (codeSet === 0 ? 103 : codeSet === 1 ? 104 : 105);
  let pos = 1;

  while (i + 6 <= bars.length) {
    const seg = bars.slice(i, i+6);
    const val = patternToCode128Value(seg);
    if (val < 0) { i++; continue; }
    if (val === 106) { // STOP
      // チェックサム検証
      const check = values[values.length-1];
      values.pop();
      if ((checksum % 103) === check) {
        return values;
      }
      return values; // チェックサム無視でも返す
    }
    checksum += val * pos;
    pos++;
    values.push(val);
    i += 6;
  }
  return values.length > 0 ? values : null;
}

function valuesToString(values, codeSet) {
  let result = '';
  for (const v of values) {
    if (codeSet === 1 && v < 96) result += C128[v];
    else if (codeSet === 0 && v < 96) result += C128[v];
    else if (codeSet === 2 && v < 100) result += (v < 10 ? '0' : '') + v;
    else result += '?';
  }
  return result;
}

function scanFrame() {
  if (found || !stream) return;
  if (video.readyState < 2) return;

  const vw = video.videoWidth;
  const vh = video.videoHeight;
  if (!vw || !vh) return;

  // バーコード認識用に横長に切り抜く（中央帯）
  const scanH = Math.round(vh * 0.25);
  const scanY = Math.round(vh * 0.38);

  canvas.width = vw;
  canvas.height = scanH;
  ctx.drawImage(video, 0, scanY, vw, scanH, 0, 0, vw, scanH);
  const imageData = ctx.getImageData(0, 0, vw, scanH);

  // 複数の水平ラインでスキャン
  const results = [];
  for (let row = 0; row < scanH; row += Math.max(1, Math.round(scanH/12))) {
    const gray = new Uint8Array(vw);
    for (let x = 0; x < vw; x++) {
      const i = (row * vw + x) * 4;
      gray[x] = (imageData.data[i]*77 + imageData.data[i+1]*150 + imageData.data[i+2]*29) >> 8;
    }
    const thresh = otsuThreshold(gray);
    const vals = decodeCode128Row(gray, vw, thresh);
    if (vals && vals.length > 0) {
      // 数字として解釈
      let str = '';
      for (const v of vals) {
        if (v < 100) str += (v < 10 ? '0' : '') + v;
      }
      if (/^\d{10,15}$/.test(str)) results.push(str);
      else {
        // コードセットBとして解釈
        let strB = '';
        for (const v of vals) {
          if (v >= 0 && v < 96) strB += C128[v];
        }
        const digs = strB.replace(/\D/g,'');
        if (digs.length >= 10) results.push(digs);
      }
    }
  }

  if (results.length > 0) {
    // 最も長い結果を採用
    const best = results.reduce((a,b) => b.length > a.length ? b : a, results[0]);
    const digits = best.replace(/\D/g,'').slice(0,15);
    if (digits.length >= 10) {
      onFound(digits);
      return;
    }
  }

  timer = setTimeout(scanFrame, INTERVAL_MS);
}

async function startCamera() {
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: {
        facingMode: {ideal: 'environment'},
        width: {ideal: 1280},
        height: {ideal: 720}
      }
    });
    video.srcObject = stream;
    await video.play();
    statusBar.style.color = '#00e5ff';
    statusBar.textContent = 'バーコードを青枠に合わせてください';
    timer = setTimeout(scanFrame, 500);
  } catch(err) {
    statusBar.style.color = '#f44336';
    statusBar.textContent = err.name === 'NotAllowedError'
      ? 'カメラの許可が必要です'
      : 'カメラエラー: ' + err.message;
  }
}

function onFound(digits) {
  found = true;
  clearTimeout(timer);
  scanline.style.display = 'none';
  statusBar.style.color = '#4caf50';
  statusBar.textContent = '✓ 読み取り成功！';
  document.getElementById('result-num').textContent = digits;
  document.getElementById('edit-input').value = digits;
  document.getElementById('result-wrap').style.display = 'block';
  document.getElementById('btn-ok').style.display = 'flex';
  document.getElementById('btn-retry').style.display = 'flex';
  updateBadge(digits.length);
}

document.getElementById('edit-input').addEventListener('input', function() {
  this.value = this.value.replace(/\D/g,'').slice(0,15);
  document.getElementById('result-num').textContent = this.value;
  updateBadge(this.value.length);
});

function updateBadge(n) {
  const el = document.getElementById('badge');
  el.textContent = n + ' / 15桁' + (n===15 ? ' ✓' : '');
  el.className = n===15 ? 'ok' : 'ng';
}

function confirm_() {
  const num = document.getElementById('edit-input').value.replace(/\D/g,'');
  if (num.length !== 15) {
    statusBar.style.color = '#f44336';
    statusBar.textContent = '15桁を確認してください（現在' + num.length + '桁）';
    return;
  }
  if (window.opener) window.opener.postMessage({type:'BARCODE_RESULT', barcode:num}, '*');
  stopAll();
  window.close();
}

function restartScan() {
  found = false;
  document.getElementById('result-wrap').style.display = 'none';
  document.getElementById('btn-ok').style.display = 'none';
  document.getElementById('btn-retry').style.display = 'none';
  scanline.style.display = 'block';
  statusBar.style.color = '#00e5ff';
  statusBar.textContent = 'バーコードを青枠に合わせてください';
  timer = setTimeout(scanFrame, 300);
}

function stopAll() {
  clearTimeout(timer);
  if (stream) stream.getTracks().forEach(t => t.stop());
}

function closeWindow() {
  stopAll();
  window.close();
}

startCamera();
</script>
</body>
</html>
