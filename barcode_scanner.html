<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>バーコードスキャン</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, sans-serif; background: #000; color: #fff; height: 100vh; display: flex; justify-content: center; }

  /* 画面全体のコンテナ（iPadでもスマホ幅に固定して操作しやすく） */
  #app-container {
    width: 100%; max-width: 500px; height: 100%;
    display: flex; flex-direction: column; background: #111;
  }

  #header { padding: 15px; background: #1a1a1a; text-align: center; border-bottom: 1px solid #333; }
  #header h1 { font-size: 16px; font-weight: 700; }

  /* --- 📷 カメラ領域（画面の上半分） --- */
  #camera-section {
    position: relative; width: 100%; height: 50vh; min-height: 300px;
    background: #000; overflow: hidden;
  }
  
  /* ライブラリが生成するビデオ要素を画面いっぱいに */
  #reader { width: 100%; height: 100%; }
  #reader video { object-fit: cover !important; width: 100% !important; height: 100% !important; }
  
  /* 邪魔な白枠や暗転を完全に消去 */
  #qr-shaded-region { display: none !important; }

  /* 読み取り成功時の「静止画（スナップショット）」 */
  #snapshot {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    object-fit: cover; display: none; z-index: 5;
  }

  /* 自作の青枠（ガイド） */
  #aim-frame {
    position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 80%; height: 120px;
    border: 3px solid #00e5ff; border-radius: 10px;
    pointer-events: none; z-index: 10;
    box-shadow: 0 0 20px rgba(0,0,0,0.6);
    transition: border-color 0.3s;
  }
  #aim-frame.success { border-color: #4caf50; background: rgba(76, 175, 80, 0.2); }
  
  #scanline {
    position: absolute; top: 0; left: 0; right: 0; height: 2px; background: #00e5ff;
    animation: sc 1.5s linear infinite;
  }
  #aim-frame.success #scanline { display: none; }
  @keyframes sc { 0% { top: 0%; } 100% { top: 100%; } }

  /* --- 📝 操作・結果領域（画面の下半分） --- */
  #action-section {
    flex: 1; padding: 20px; background: #111;
    display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
  }

  #status-msg {
    font-size: 15px; font-weight: bold; color: #00e5ff; margin-bottom: 20px;
  }

  /* 結果UI（初期は非表示） */
  #result-ui { width: 100%; display: none; }
  
  #einput {
    width: 100%; font-size: 24px; font-family: monospace; font-weight: bold; letter-spacing: 2px;
    padding: 15px; border-radius: 10px; border: 2px solid #4caf50; background: #222; color: #fff;
    text-align: center; margin-bottom: 20px;
  }

  .btns { display: flex; gap: 10px; width: 100%; }
  .btn { flex: 1; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: bold; border: none; cursor: pointer; }
  .b-ok { background: #185FA5; color: #fff; }
  .b-retry { background: #333; color: #ccc; }
  
  /* 閉じるボタン（常に下部に配置） */
  #close-btn-wrap { margin-top: auto; padding-top: 20px; width: 100%; }
  .b-close { width: 100%; padding: 14px; border-radius: 10px; background: #1a1a1a; color: #888; border: 1px solid #333; font-weight: bold; }

</style>
</head>
<body>

<div id="app-container">
  <div id="header">
    <h1>📷 バーコードスキャン10</h1>
  </div>

  <!-- カメラと青枠の領域 -->
  <div id="camera-section">
    <div id="reader"></div>
    <img id="snapshot" alt="スキャン結果">
    <div id="aim-frame">
      <div id="scanline"></div>
    </div>
  </div>

  <!-- 結果表示とボタンの領域 -->
  <div id="action-section">
    <div id="status-msg">15桁のバーコードを枠に合わせてください</div>
    
    <div id="result-ui">
      <input type="tel" id="einput" maxlength="15" inputmode="numeric">
      <div class="btns">
        <button class="btn b-ok" onclick="doConfirm()">✅ 確定</button>
        <button class="btn b-retry" onclick="doRetry()">🔄 再スキャン</button>
      </div>
    </div>

    <div id="close-btn-wrap">
      <button class="b-close" onclick="doClose()">閉じる</button>
    </div>
  </div>
</div>

<script>
let scanner = null;
let isScanning = true;

async function startScanner() {
  scanner = new Html5Qrcode("reader");

  const config = {
    fps: 15,
    // 💡iPad対策: 範囲を絞らず(qrboxなし)カメラ全体を解析させることで、解像度やアスペクト比のズレによる読み取り失敗をなくす
    experimentalFeatures: { useBarCodeDetectorIfSupported: true },
    formatsToSupport: [ Html5QrcodeSupportedFormats.CODE_128, Html5QrcodeSupportedFormats.ITF ]
  };

  try {
    // iPadの重い4K映像などを防ぐため、解像度を1280x720程度に制限して処理を軽くする
    await scanner.start(
      { facingMode: "environment", width: { ideal: 1280 }, height: { ideal: 720 } },
      config,
      (decodedText) => {
        if (!isScanning) return;
        const cleanCode = decodedText.replace(/\D/g, '');
        
        // ★厳格な15桁チェック
        if (cleanCode.length === 15) {
          isScanning = false;
          onSuccess(cleanCode);
        }
      },
      () => {} // エラー無視
    );
  } catch (err) {
    document.getElementById('status-msg').textContent = "カメラの起動に失敗しました";
  }
}

function onSuccess(digits) {
  // 💡iOSフリーズ対策: カメラの映像(Video)から「写真(Canvas)」を生成し、それを画面に貼り付ける
  const videoEl = document.querySelector('#reader video');
  if (videoEl) {
    const canvas = document.createElement('canvas');
    canvas.width = videoEl.videoWidth;
    canvas.height = videoEl.videoHeight;
    canvas.getContext('2d').drawImage(videoEl, 0, 0, canvas.width, canvas.height);
    
    const snapshotEl = document.getElementById('snapshot');
    snapshotEl.src = canvas.toDataURL('image/jpeg');
    snapshotEl.style.display = 'block'; // 写真を表示
  }

  // 裏で動いているスキャナーの処理を完全に一時停止（Video要素には触らないためバグらない）
  if (scanner) scanner.pause(true);

  // UIの更新（カメラ領域の下に結果を出す）
  document.getElementById('aim-frame').classList.add('success');
  document.getElementById('status-msg').style.display = 'none';
  document.getElementById('result-ui').style.display = 'block';
  document.getElementById('einput').value = digits;

  // バイブレーション
  if (navigator.vibrate) navigator.vibrate(100);
}

function doRetry() {
  // UIを元に戻す
  document.getElementById('snapshot').style.display = 'none';
  document.getElementById('aim-frame').classList.remove('success');
  document.getElementById('result-ui').style.display = 'none';
  document.getElementById('status-msg').style.display = 'block';
  document.getElementById('einput').value = '';

  // スキャナー再開
  if (scanner) scanner.resume();
  
  // 誤動作防止のため少し遅らせてフラグON
  setTimeout(() => { isScanning = true; }, 300);
}

function doConfirm() {
  const val = document.getElementById('einput').value;
  const cleanVal = val.replace(/\D/g, '');
  
  if (cleanVal.length !== 15) {
    alert("15桁の数字に修正してください。");
    return;
  }

  if (window.opener) window.opener.postMessage({ type: 'BARCODE_RESULT', barcode: cleanVal }, '*');
  doClose();
}

function doClose() {
  if (scanner && scanner.isScanning) {
    scanner.stop().then(() => window.close()).catch(() => window.close());
  } else {
    window.close();
  }
}

window.onload = startScanner;
</script>
</body>
</html>
