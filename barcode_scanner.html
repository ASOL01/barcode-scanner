<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>バーコードスキャン</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,sans-serif;background:#111;color:#fff;height:100vh;display:flex;justify-content:center;align-items:center;}

/* iPad/PC対策: 画面が大きすぎる場合は幅を制限して中央に寄せる */
#app-container {
  width: 100%;
  max-width: 500px; /* スマホサイズに固定 */
  height: 100%;
  max-height: 900px;
  display: flex;
  flex-direction: column;
  background: #000;
  position: relative;
  box-shadow: 0 0 20px rgba(0,0,0,0.5);
}

#header{padding:12px 16px 8px; flex-shrink:0; background:#111;}
#header h1{font-size:15px;font-weight:700;}
#header p{font-size:11px;color:#888;margin-top:2px;}

#video-wrap{position:relative;flex:1;background:#000;overflow:hidden;}
video{width:100%;height:100%;object-fit:cover;display:block;}

#aim{position:absolute;top:50%;left:50%;transform:translate(-50%,-60%);width:80%;border:2px solid #00e5ff;border-radius:6px;padding-top:25%;pointer-events:none;}
#scanline{position:absolute;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,#00e5ff,transparent);animation:sc 2s linear infinite;}
@keyframes sc{0%{top:0%}100%{top:100%}}

#msg{position:absolute;bottom:0;left:0;right:0;padding:12px;text-align:center;font-size:13px;font-weight:600;background:rgba(0,0,0,0.7);}

#footer{background:#181818;padding:12px 16px 24px;flex-shrink:0;}
#result{display:none;margin-bottom:10px;}
#rnum{font-size:24px;font-weight:700;letter-spacing:3px;font-family:monospace;text-align:center;padding:10px;background:#252525;border-radius:8px;margin-bottom:8px;color:#00e5ff;}
#einput{width:100%;font-size:18px;font-family:monospace;font-weight:700;letter-spacing:2px;padding:10px;border-radius:8px;border:1.5px solid #444;background:#252525;color:#fff;text-align:center;}

.btns{display:flex;gap:10px;margin-top:10px;}
.btn{flex:1;padding:14px;border-radius:10px;font-size:14px;font-weight:700;border:none;cursor:pointer;}
.b-ok{background:#185FA5;color:#fff;}
.b-retry{background:#333;color:#ccc;}
.b-close{background:#1a1a1a;color:#777;}
</style>
</head>
<body>

<div id="app-container">
  <div id="header">
    <h1>📷 バーコードスキャン3</h1>
    <p>バーコードを枠に合わせてください</p>
  </div>

  <div id="video-wrap">
    <video id="video" autoplay playsinline muted></video>
    <div id="aim"><div id="scanline"></div></div>
    <div id="msg">カメラを起動中...</div>
  </div>

  <div id="footer">
    <div id="result">
      <div id="rnum"></div>
      <input type="tel" id="einput" maxlength="15" inputmode="numeric">
    </div>
    <div class="btns">
      <button class="btn b-ok" id="bok" onclick="doConfirm()" style="display:none;">✅ 確定</button>
      <button class="btn b-retry" id="bretry" onclick="doRestart()" style="display:none;">🔄 再読み込み</button>
      <button class="btn b-close" onclick="doClose()">閉じる</button>
    </div>
  </div>
</div>

<script>
const video = document.getElementById('video');
const msg = document.getElementById('msg');
let stream = null;
let detector = null;
let isScanning = false;

// --- 初期化: ブラウザ標準のバーコード検出器が使えるか確認 ---
async function initDetector() {
  if (!('BarcodeDetector' in window)) {
    msg.innerHTML = '<span style="color:#f44336">非対応ブラウザです<br>最新のSafari(iOS17+)またはChromeを使用してください</span>';
    return false;
  }
  // CODE-128とITFに対応
  detector = new BarcodeDetector({ formats: ['code_128', 'itf'] });
  return true;
}

async function startCamera() {
  const ready = await initDetector();
  if (!ready) return;

  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { 
        facingMode: 'environment',
        width: { ideal: 1280 },
        height: { ideal: 720 }
      }
    });
    video.srcObject = stream;
    video.onplaying = () => {
      msg.textContent = "枠内にバーコードを近づけてください";
      isScanning = true;
      render();
    };
  } catch (err) {
    msg.textContent = "カメラ起動エラー: " + err.name;
  }
}

// --- 解析ループ (OSネイティブの解析機能を使用) ---
async function render() {
  if (!isScanning) return;

  try {
    // 映像から直接バーコードを検出（これが最強に速くて正確）
    const barcodes = await detector.detect(video);
    
    if (barcodes.length > 0) {
      const code = barcodes[0].rawValue;
      // 数字のみ抽出して15桁までに制限
      const cleanCode = code.replace(/\D/g, '').slice(0, 15);
      
      if (cleanCode.length >= 10) {
        onFound(cleanCode);
        return; // ループ終了
      }
    }
  } catch (e) {
    console.error("Detection error:", e);
  }

  requestAnimationFrame(render);
}

function onFound(digits) {
  isScanning = false;
  document.getElementById('scanline').style.display = 'none';
  msg.style.color = '#4caf50';
  msg.textContent = "✓ 読み取り成功";
  
  document.getElementById('rnum').textContent = digits;
  document.getElementById('einput').value = digits;
  document.getElementById('result').style.display = 'block';
  document.getElementById('bok').style.display = 'block';
  document.getElementById('bretry').style.display = 'block';
  
  // バイブレーション（対応端末のみ）
  if (navigator.vibrate) navigator.vibrate(200);
}

function doRestart() {
  isScanning = true;
  document.getElementById('result').style.display = 'none';
  document.getElementById('bok').style.display = 'none';
  document.getElementById('bretry').style.display = 'none';
  document.getElementById('scanline').style.display = 'block';
  msg.style.color = '#fff';
  msg.textContent = "枠内にバーコードを近づけてください";
  render();
}

function doConfirm() {
  const val = document.getElementById('einput').value;
  if (window.opener) window.opener.postMessage({ type: 'BARCODE_RESULT', barcode: val }, '*');
  doClose();
}

function doClose() {
  if (stream) stream.getTracks().forEach(t => t.stop());
  window.close();
}

window.onload = startCamera;
</script>
</body>
</html>
