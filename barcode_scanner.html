<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>バーコードスキャン</title>
<!-- ライブラリを読み込み（これがiPhone/Androidの差を埋めます） -->
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,sans-serif;background:#111;color:#fff;height:100vh;display:flex;justify-content:center;align-items:center;}

/* iPad/PC対策: 画面が大きすぎる場合は幅を制限 */
#app-container {
  width: 100%; max-width: 500px; height: 100%; max-height: 900px;
  display: flex; flex-direction: column; background: #000; position: relative;
}

#header{padding:12px 16px 8px; flex-shrink:0; background:#111; z-index:10;}
#header h1{font-size:15px;font-weight:700;}
#header p{font-size:11px;color:#888;margin-top:2px;}

/* スキャナー表示領域 */
#reader { width: 100% !important; flex: 1; background: #000; position: relative; border:none !important; }
#reader video { object-fit: cover !important; }

/* 自作の青枠をライブラリの上に重ねる */
#aim-overlay {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -60%);
  width: 80%; padding-top: 25%; border: 2px solid #00e5ff; border-radius: 6px;
  pointer-events: none; z-index: 5;
}
#scanline {
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg,transparent,#00e5ff,transparent);
  animation: sc 2s linear infinite;
}
@keyframes sc{0%{top:0%}100%{top:100%}}

#msg{position:absolute; bottom:0; left:0; right:0; padding:12px; text-align:center; font-size:13px; font-weight:600; background:rgba(0,0,0,0.7); z-index:10;}

#footer{background:#181818; padding:12px 16px 24px; flex-shrink:0; z-index:10;}
#result{display:none; margin-bottom:10px;}
#rnum{font-size:24px; font-weight:700; letter-spacing:3px; font-family:monospace; text-align:center; padding:10px; background:#252525; border-radius:8px; margin-bottom:8px; color:#00e5ff;}
#einput{width:100%; font-size:18px; font-family:monospace; font-weight:700; letter-spacing:2px; padding:10px; border-radius:8px; border:1.5px solid #444; background:#252525; color:#fff; text-align:center;}

.btns{display:flex; gap:10px; margin-top:10px;}
.btn{flex:1; padding:14px; border-radius:10px; font-size:14px; font-weight:700; border:none; cursor:pointer;}
.b-ok{background:#185FA5; color:#fff;}
.b-retry{background:#333; color:#ccc;}
.b-close{background:#1a1a1a; color:#777;}
</style>
</head>
<body>

<div id="app-container">
  <div id="header">
    <h1>📷 バーコードスキャン4</h1>
    <p>バーコードを枠に合わせてください</p>
  </div>

  <div style="position:relative; flex:1; display:flex; flex-direction:column;">
    <!-- ライブラリがビデオを表示する場所 -->
    <div id="reader"></div>
    <!-- 重ねるガイド枠 -->
    <div id="aim-overlay"><div id="scanline"></div></div>
    <div id="msg">カメラを起動中...</div>
  </div>

  <div id="footer">
    <div id="result">
      <div id="rnum"></div>
      <input type="tel" id="einput" maxlength="15" inputmode="numeric">
    </div>
    <div class="btns">
      <button class="btn b-ok" id="bok" onclick="doConfirm()" style="display:none;">✅ 確定</button>
      <button class="btn b-retry" id="bretry" onclick="doRestart()" style="display:none;">🔄 再試行</button>
      <button class="btn b-close" onclick="doClose()">閉じる</button>
    </div>
  </div>
</div>

<script>
let html5QrCode = null;
const msg = document.getElementById('msg');

async function startScanner() {
  // ライブラリの初期化
  html5QrCode = new Html5Qrcode("reader");

  const config = {
    fps: 10,
    qrbox: { width: 300, height: 150 }, // スキャン対象エリア
    aspectRatio: 1.0,
    // 対応フォーマットをCODE-128とITFに限定して高速化
    formatsToSupport: [ 
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.ITF
    ]
  };

  try {
    await html5QrCode.start(
      { facingMode: "environment" },
      config,
      (decodedText) => {
        // 成功時の処理
        const cleanCode = decodedText.replace(/\D/g, '').slice(0, 15);
        if (cleanCode.length >= 10) {
          onSuccess(cleanCode);
        }
      },
      (errorMessage) => {
        // スキャン中は常にエラーが出るので無視
      }
    );
    msg.textContent = "バーコードを枠に合わせてください";
  } catch (err) {
    msg.textContent = "カメラ起動エラー: " + err;
  }
}

function onSuccess(digits) {
  // スキャン停止
  html5QrCode.stop();
  
  document.getElementById('aim-overlay').style.display = 'none';
  msg.style.color = '#4caf50';
  msg.textContent = "✓ 読み取り成功";
  
  document.getElementById('rnum').textContent = digits;
  document.getElementById('einput').value = digits;
  document.getElementById('result').style.display = 'block';
  document.getElementById('bok').style.display = 'block';
  document.getElementById('bretry').style.display = 'block';

  if (navigator.vibrate) navigator.vibrate(200);
}

function doRestart() {
  document.getElementById('result').style.display = 'none';
  document.getElementById('bok').style.display = 'none';
  document.getElementById('bretry').style.display = 'none';
  document.getElementById('aim-overlay').style.display = 'block';
  msg.style.color = '#fff';
  startScanner();
}

function doConfirm() {
  const val = document.getElementById('einput').value;
  if (window.opener) window.opener.postMessage({ type: 'BARCODE_RESULT', barcode: val }, '*');
  doClose();
}

function doClose() {
  if (html5QrCode && html5QrCode.isScanning) {
    html5QrCode.stop().then(() => window.close());
  } else {
    window.close();
  }
}

// 起動
window.onload = startScanner;
</script>
</body>
</html>
