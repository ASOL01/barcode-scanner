<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>バーコードスキャン</title>
<script src="https://unpkg.com/html5-qrcode"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:-apple-system,sans-serif;background:#000;color:#fff;height:100vh;display:flex;justify-content:center;overflow:hidden;}

/* 全体コンテナ */
#app-container {
  width: 100%; max-width: 500px; height: 100%;
  display: flex; flex-direction: column; position: relative; background: #000;
}

#header{padding:15px; flex-shrink:0; background:rgba(17,17,17,0.9); z-index:20;}
#header h1{font-size:16px; font-weight:700;}
#header p{font-size:11px; color:#aaa; margin-top:4px;}

/* スキャナー領域 */
#reader-wrap { flex: 1; position: relative; overflow: hidden; background: #000; }
#reader { width: 100%; height: 100%; }
#reader video { object-fit: cover !important; width: 100% !important; height: 100% !important; }

/* ライブラリの白枠オーバーレイUIを強制非表示 */
#qr-shaded-region { display: none !important; }

/* --- 自作の青枠 --- */
#aim-frame {
  position: absolute; top: 50%; left: 50%; transform: translate(-50%, -60%);
  width: 80%; height: 140px;
  border: 3px solid #00e5ff; border-radius: 12px;
  pointer-events: none; z-index: 10;
  transition: all 0.2s ease;
  box-shadow: 0 0 20px rgba(0,0,0,0.5), inset 0 0 10px rgba(0,0,0,0.5);
}

/* 読み取り成功時のクラス */
body.is-success #aim-frame {
  border-color: #4caf50; 
  background: rgba(76, 175, 80, 0.1); 
  box-shadow: 0 0 30px rgba(76, 175, 80, 0.4);
}
body.is-success #scanline { display: none; }

#scanline {
  position: absolute; top: 0; left: 0; right: 0; height: 2px;
  background: linear-gradient(90deg,transparent,#00e5ff,transparent);
  animation: sc 2s linear infinite;
}
@keyframes sc{0%{top:0%}100%{top:100%}}

#msg {
  position: absolute; bottom: 20px; left: 10px; right: 10px;
  padding: 12px; text-align:center; font-size:14px; font-weight:600;
  background: rgba(0,0,0,0.8); border-radius: 8px; z-index: 20;
}
body.is-success #msg { color: #4caf50; }

/* フッター */
#footer { background: #111; padding: 15px 15px 30px; flex-shrink:0; z-index: 20; border-top: 1px solid #333; }

/* 結果入力エリア（初期は非表示、is-successで表示） */
#result-box { display: none; margin-bottom: 10px; }
body.is-success #result-box { display: block; }

#rnum { font-size: 26px; font-weight: 700; letter-spacing: 2px; text-align: center; color: #00e5ff; margin-bottom: 10px; font-family: monospace; }
#einput { width: 100%; font-size: 20px; padding: 12px; border-radius: 10px; border: 1px solid #444; background: #222; color: #fff; text-align: center; }

/* ボタンエリア */
.btns { display: flex; gap: 10px; margin-top: 15px; }
.btn { flex: 1; padding: 15px; border-radius: 12px; font-size: 15px; font-weight: 700; border: none; cursor: pointer; }

/* 確定・再試行ボタンは初期非表示、is-successで表示 */
#bok, #bretry { display: none; }
body.is-success #bok, body.is-success #bretry { display: block; }

.b-ok { background: #185FA5; color: #fff; }
.b-retry { background: #333; color: #ccc; }
.b-close { background: #1a1a1a; color: #777; border: 1px solid #333; }
</style>
</head>
<body>

<div id="app-container">
  <div id="header">
    <h1>📷 バーコードスキャン8</h1>
    <p>青枠内にバーコードを水平に合わせてください</p>
  </div>

  <div id="reader-wrap">
    <div id="reader"></div>
    <div id="aim-frame">
      <div id="scanline"></div>
    </div>
    <div id="msg">カメラを起動中...</div>
  </div>

  <div id="footer">
    <div id="result-box">
      <div id="rnum"></div>
      <input type="tel" id="einput" maxlength="15" inputmode="numeric">
    </div>
    <div class="btns">
      <button class="btn b-ok" id="bok" onclick="doConfirm()">✅ 確定</button>
      <button class="btn b-retry" id="bretry" onclick="doRestart()">🔄 再スキャン</button>
      <button class="btn b-close" onclick="doClose()">閉じる</button>
    </div>
  </div>
</div>

<script>
let html5QrCode = null;
let isScanEnabled = true; // プログラム内部でのスキャン許可フラグ
const msg = document.getElementById('msg');

async function startScanner() {
  html5QrCode = new Html5Qrcode("reader");

  // スキャン設定 (白枠を出さないフルスクリーン解析)
  const config = {
    fps: 15,
    experimentalFeatures: {
        useBarCodeDetectorIfSupported: true 
    },
    formatsToSupport: [ 
      Html5QrcodeSupportedFormats.CODE_128,
      Html5QrcodeSupportedFormats.ITF
    ]
  };

  try {
    await html5QrCode.start(
      { facingMode: "environment" },
      config,
      (decodedText) => {
        // スキャン許可フラグがOFFの時は無視する
        if (!isScanEnabled) return;

        // 数字のみを抽出
        const cleanCode = decodedText.replace(/\D/g, '');
        
        // ★重要: 「ピッタリ15桁」の場合のみ成功とみなす
        if (cleanCode.length === 15) {
          isScanEnabled = false; // 二重読み込み防止
          onSuccess(cleanCode);
        }
      },
      () => {} // スキャン中のエラーログは無視
    );
    msg.textContent = "15桁のバーコードを枠に合わせてください";
  } catch (err) {
    msg.textContent = "カメラの起動に失敗しました";
  }
}

function onSuccess(digits) {
  // UIの更新 (CSSクラスを付与するだけでボタン等が一瞬で表示される)
  document.body.classList.add('is-success');
  
  document.getElementById('rnum').textContent = digits;
  document.getElementById('einput').value = digits;
  msg.textContent = "✓ 読み取り成功";

  // バイブレーション
  if (navigator.vibrate) navigator.vibrate(100);

  // 【iOSフリーズ対策】
  // カメラの通信機能(MediaStream)自体は止めず、HTMLの映像表示だけを一時停止してフリーズを回避
  const videoEl = document.querySelector('#reader video');
  if (videoEl) {
    videoEl.pause();
  }
}

function doRestart() {
  // UIを初期状態に戻す
  document.body.classList.remove('is-success');
  msg.textContent = "15桁のバーコードを枠に合わせてください";
  
  // 映像表示を再開
  const videoEl = document.querySelector('#reader video');
  if (videoEl) {
    videoEl.play();
  }

  // 0.5秒後にスキャン許可フラグをONにする（連続誤タップ防止）
  setTimeout(() => {
    isScanEnabled = true;
  }, 500);
}

function doConfirm() {
  const val = document.getElementById('einput').value;
  // 確定処理 (15桁に満たない場合の手動入力バリデーション)
  const cleanVal = val.replace(/\D/g, '');
  if (cleanVal.length !== 15) {
    alert("15桁の数字に修正してください。");
    return;
  }

  if (window.opener) window.opener.postMessage({ type: 'BARCODE_RESULT', barcode: cleanVal }, '*');
  doClose();
}

function doClose() {
  if (html5QrCode && html5QrCode.isScanning) {
    html5QrCode.stop().then(() => window.close()).catch(() => window.close());
  } else {
    window.close();
  }
}

// ページ読み込み時に実行
window.onload = startScanner;
</script>
</body>
</html>
